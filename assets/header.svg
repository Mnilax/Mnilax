<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Mnilax — now building lintcha</title>
  <desc id="desc">A restrained graphite banner with a lime accent and the words AI systems, onchain data and automation.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4fc50"/>
      <stop offset="1" stop-color="#86a62d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="#0d1117"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)" opacity="0.7"/>
  <path d="M54 66h34l16 28 16-28h34" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
  <text x="54" y="144" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" font-weight="700" letter-spacing="3">MNILAX</text>
  <text x="57" y="183" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">AI SYSTEMS · ONCHAIN DATA · AUTOMATION</text>
  <line x1="780" y1="74" x2="1140" y2="74" stroke="#30363d"/>
  <text x="1140" y="124" text-anchor="end" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2">NOW BUILDING</text>
  <text x="1140" y="172" text-anchor="end" fill="#d4fc50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" letter-spacing="2">LINTCHA</text>
  <line x1="780" y1="198" x2="1140" y2="198" stroke="#d4fc50" stroke-width="3"/>
</svg>
